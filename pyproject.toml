[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "rapidxlsx"
description = "High-performance parallel Excel (XLSX) spreadsheet writer"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Amin Fathullah", email = "amin_fathullah@yahoo.com" }
]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Build Tools",
]
dynamic = ["version"]
[project.optional-dependencies]
tests = [
    "pytest",
]
[tool.maturin]
python-source = "python"
module-name = "rapidxlsx._rapidxlsx"
manifest-path = "crates/rapidxlsx-python/Cargo.toml"
include = [
    { path = "LICENSE", format = "sdist" },
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo"
]
